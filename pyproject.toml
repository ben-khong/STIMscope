[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-loop-pipeline"
version = "0.1.0"
description = "Real-time imaging pipeline: ingest, diagnostic gating, inference, hardware actuation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
camera = ["opencv-python>=4.8"]
dev = ["pytest>=7.4", "pybind11>=2.11", "cmake>=3.18"]

[project.scripts]
clpipe = "clpipe.cli:main"

[tool.setuptools.packages.find]
include = ["clpipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
